<rect x="140" y="274" width="380" height="56" rx="9" fill="#e8eef7" stroke="#5b7aa6" stroke-width="2"/>
<text x="330" y="297" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">chunk_documents</text><text x="330" y="317" font-size="12" fill="#444" text-anchor="middle">lossless split, max 4000 characters</text>
<line x1="330" y1="248" x2="330" y2="272" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="140" y="356" width="380" height="56" rx="9" fill="#fff1d6" stroke="#d08a1c" stroke-width="2"/>
<text x="330" y="379" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">extract  ·  gpt-5.6-luna</text><text x="330" y="399" font-size="12" fill="#444" text-anchor="middle">parallel: one call per chunk (Send)</text>
<line x1="330" y1="330" x2="330" y2="354" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="140" y="438" width="380" height="56" rx="9" fill="#e8eef7" stroke="#5b7aa6" stroke-width="2"/>
<text x="330" y="461" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">verify_evidence</text><text x="330" y="481" font-size="12" fill="#444" text-anchor="middle">quote check, candidate ids, source_doc</text>
<line x1="330" y1="412" x2="330" y2="436" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="140" y="520" width="380" height="56" rx="9" fill="#fff1d6" stroke="#d08a1c" stroke-width="2"/>
<text x="330" y="543" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">review_completeness  ·  gpt-6-luna</text><text x="330" y="563" font-size="12" fill="#444" text-anchor="middle">parallel: one call per document</text>
<line x1="330" y1="494" x2="330" y2="518" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="140" y="602" width="380" height="56" rx="9" fill="#e8eef7" stroke="#5b7aa6" stroke-width="2"/>
<text x="330" y="625" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">review_gate</text><text x="330" y="645" font-size="12" fill="#444" text-anchor="middle">join reviews, decide whether to loop</text>
