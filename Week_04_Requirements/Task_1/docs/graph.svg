<rect x="140" y="1012" width="380" height="56" rx="9" fill="#fff1d6" stroke="#d08a1c" stroke-width="2"/>
<text x="330" y="1035" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">name_requirements  ·  gpt-5.4-nano</text><text x="330" y="1055" font-size="12" fill="#444" text-anchor="middle">short descriptive name</text>
<line x1="330" y1="986" x2="330" y2="1010" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="140" y="1094" width="380" height="56" rx="9" fill="#e8eef7" stroke="#5b7aa6" stroke-width="2"/>
<text x="330" y="1117" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">assign_ids</text><text x="330" y="1137" font-size="12" fill="#444" text-anchor="middle">REQ- / BL- ids, ordering by priority and date</text>
<line x1="330" y1="1068" x2="330" y2="1092" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="140" y="1176" width="380" height="56" rx="9" fill="#e8eef7" stroke="#5b7aa6" stroke-width="2"/>
<text x="330" y="1199" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">render_doc</text><text x="330" y="1219" font-size="12" fill="#444" text-anchor="middle">Markdown document + spec self-check</text>
<line x1="330" y1="1150" x2="330" y2="1174" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="270" y="1270" width="120" height="32" rx="16" fill="#2b2b2b"/><text x="330" y="1292" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">END</text>
<line x1="330" y1="1232" x2="330" y2="1268" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M520,630 H590 V384 H522" fill="none" stroke="#b3402a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#r)"/>
<text x="600" y="493" font-size="12" fill="#b3402a">missing items found</text><text x="600" y="507" font-size="12" fill="#b3402a">and round &lt; 2:</text><text x="600" y="521" font-size="12" fill="#b3402a">re-extract only the</text><text x="600" y="535" font-size="12" fill="#b3402a">affected documents</text>
<text x="600" y="654" font-size="12" fill="#555">otherwise: continue</text>
</svg>