<rect x="140" y="684" width="380" height="56" rx="9" fill="#fff1d6" stroke="#d08a1c" stroke-width="2"/>
<text x="330" y="707" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">merge_and_resolve  ·  gpt-6-luna</text><text x="330" y="727" font-size="12" fill="#444" text-anchor="middle">topic clusters, 2 rounds: duplicates, conflicts, blacklist</text>
<line x1="330" y1="658" x2="330" y2="682" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="140" y="766" width="380" height="56" rx="9" fill="#fff1d6" stroke="#d08a1c" stroke-width="2"/>
<text x="330" y="789" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">prioritize  ·  gpt-5.4-nano</text><text x="330" y="809" font-size="12" fill="#444" text-anchor="middle">code baseline from signals, model moves it by &lt;= 1 level</text>
<line x1="330" y1="740" x2="330" y2="764" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="140" y="848" width="380" height="56" rx="9" fill="#e8eef7" stroke="#5b7aa6" stroke-width="2"/>
<text x="330" y="871" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">retrieve_context</text><text x="330" y="891" font-size="12" fill="#444" text-anchor="middle">source passages found by quote anchoring</text>
<line x1="330" y1="822" x2="330" y2="846" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="140" y="930" width="380" height="56" rx="9" fill="#fff1d6" stroke="#d08a1c" stroke-width="2"/>
<text x="330" y="953" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">write_paragraphs  ·  gpt-5.6-luna</text><text x="330" y="973" font-size="12" fill="#444" text-anchor="middle">paragraph grounded in the passages, guarded</text>
