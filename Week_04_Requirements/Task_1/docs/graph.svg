<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1360" width="820" height="1360" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3402a"/></marker></defs>
<rect width="820" height="1360" fill="#ffffff"/>
<text x="30" y="38" font-size="22" font-weight="bold" fill="#222">Requirements refinement network (LangGraph)</text>
<rect x="30" y="58" width="22" height="16" rx="3" fill="#e8eef7" stroke="#5b7aa6" stroke-width="1.5"/><text x="60" y="71" font-size="13" fill="#333">deterministic node (code)</text>
<rect x="290" y="58" width="22" height="16" rx="3" fill="#fff1d6" stroke="#d08a1c" stroke-width="1.5"/><text x="320" y="71" font-size="13" fill="#333">agentic node (LLM call)</text>
<line x1="530" y1="66" x2="570" y2="66" stroke="#b3402a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/><text x="578" y="71" font-size="13" fill="#333">feedback loop</text>
<rect x="270" y="122" width="120" height="32" rx="16" fill="#2b2b2b"/><text x="330" y="144" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">START</text>
<rect x="140" y="192" width="380" height="56" rx="9" fill="#e8eef7" stroke="#5b7aa6" stroke-width="2"/>
<text x="330" y="215" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">load_corpus</text><text x="330" y="235" font-size="12" fill="#444" text-anchor="middle">read all .txt / .eml / .md recursively</text>
